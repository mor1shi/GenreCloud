name: Spotify test report
description: Report results of testing the experimental Spotify source
labels: [spotify, experimental]
body:
  - type: markdown
    attributes:
      value: |
        Spotify support is **experimental** and has not been tested against live
        accounts by the maintainers. Please do not include your Client ID,
        tokens, email or real library exports.
  - type: input
    id: version
    attributes:
      label: GenreCloud version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: premium
    attributes:
      label: Is the Spotify account Premium?
      options:
        - 'Yes'
        - 'No'
        - Prefer not to say
    validations:
      required: true
  - type: dropdown
    id: connected
    attributes:
      label: Did the PKCE connection succeed?
      options:
        - Connected and collected tracks
        - Connected, but collection failed
        - Authorization failed
        - Not tried
    validations:
      required: true
  - type: textarea
    id: counts
    attributes:
      label: Counts (no names needed)
      placeholder: |
        Saved tracks reported by Spotify:
        Tracks collected by GenreCloud:
        Groups queried:
        Tracks with genres:
        Tracks without genres:
  - type: textarea
    id: errors
    attributes:
      label: Errors or diagnostics
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include tokens, Client ID, account details or real track names.
          required: true
