name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please use **demo data** or invented track names.
        Never paste tokens, cookies, account ids or real library exports.
  - type: input
    id: version
    attributes:
      label: GenreCloud version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 128, Chrome 131
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - Yandex Music
        - Spotify (experimental)
        - Demo data
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Use "Copy diagnostics" in the app. It contains no personal data.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, cookies, account ids and real library data from this report.
          required: true
